<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ACF 3D Assemblies</title>
<style>
/* Layout: one screen. Slim title strip (job · mark), the model fills the rest, a parts strip along the bottom. */
:root {
  --bg: #eef0f2; --panel: #ffffff; --fg: #1d2329; --muted: #5d6873; --line: #d3d8dd;
  --accent: #b3202a; --main: #8a96a3; --part: #c8483f; --bolt: #2f3740; --weld: #e39b2d;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15191d; --panel: #1e2328; --fg: #e7eaed; --muted: #98a3ad; --line: #333a41;
  --accent: #ef5b62; --main: #9aa7b4; --part: #e0645b; --bolt: #c9d1d9; --weld: #f0ad44; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15191d; --panel: #1e2328; --fg: #e7eaed; --muted: #98a3ad; --line: #333a41;
  --accent: #ef5b62; --main: #9aa7b4; --part: #e0645b; --bolt: #c9d1d9; --weld: #f0ad44; color-scheme: dark }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); display: flex; flex-direction: column; overflow: hidden; }
header { background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 600; letter-spacing: .08em; color: var(--accent); font-size: 13px; }
.job { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 0; }
.mark { font-family: var(--mono); font-weight: 500; font-size: 22px; line-height: 1; }
.spacer { flex: 1; }
nav.marks { display: flex; gap: 6px; flex-wrap: wrap; }
nav.marks a { font-family: var(--mono); font-size: 13px; text-decoration: none; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; }
nav.marks a[aria-current="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg); }
nav.marks a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { flex: 1; position: relative; min-height: 0; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.tools { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; display: flex; flex-direction: column; gap: 6px; }
.tools button { font: 500 12px var(--sans); background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; cursor: pointer; }
.size { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; max-width: calc(100% - 24px); font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 9px; }
footer { background: var(--panel); border-top: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 6px; }
.parts { display: flex; gap: 6px 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 13px; }
.parts span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.note { font-size: 11px; color: var(--muted); }
.picker { padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: auto; display: flex; flex-direction: column; gap: 18px; max-width: 640px; }
.picker h1 { font-size: 20px; font-weight: 600; margin: 0; text-wrap: balance; }
.picker section { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.picker .job { font-size: 13px; }
.msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; text-align: center; padding: 16px; }
</style>
<style>:root{color-scheme:light}body{margin:0;font-size:14px}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<header id="hdr" hidden>
  <span class="brand">ACF</span>
  <span class="mark" id="mark">–</span>
  <span class="job" id="job"></span>
  <span class="spacer"></span>
  <nav class="marks" id="marks" aria-label="Assemblies in this job"></nav>
</header>
<main id="stage" hidden>
  <canvas id="cv" aria-label="3D view of the assembly. Drag to rotate, pinch or scroll to zoom."></canvas>
  <div class="size" id="size"></div>
  <div class="tools">
    <button id="b-reset" type="button">Reset</button>
    <button id="b-top" type="button">Top</button>
    <button id="b-side" type="button">Side</button>
    <button id="b-end" type="button">End</button>
  </div>
  <div class="msg" id="msg" hidden></div>
</main>
<footer id="ftr" hidden>
  <div class="parts" id="parts"></div>
  <div class="note" id="note"></div>
</footer>
<div class="picker" id="picker" hidden>
  <h1>ACF 3D assemblies</h1>
  <p class="note">Scan the QR code on an assembly drawing, or pick a piece below. Drag to rotate, pinch to zoom.</p>
  <div id="joblist"></div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cache = {};
let index = null, renderer, scene, camera, controls, group, radius = 100;

function ftin(inches) {
  const neg = inches < 0; inches = Math.abs(inches);
  let s = Math.round(inches * 16) / 16, ft = Math.floor(s / 12), r = s - ft * 12, i = Math.floor(r), fr = Math.round((r - i) * 16);
  let frac = '';
  if (fr) { let n = fr, d = 16; while (n % 2 === 0) { n /= 2; d /= 2; } frac = ` ${n}/${d}`; }
  return (neg ? '-' : '') + `${ft}'-${i}${frac}"`;
}
const slug = (job, mark) => `${job}-${mark.toLowerCase().replace(/_/g, '-')}`;

async function getJSON(p) { if (!cache[p]) cache[p] = fetch(p).then(r => { if (!r.ok) throw new Error(p); return r.json(); }); return cache[p]; }

function initGL() {
  if (renderer) return;
  renderer = new THREE.WebGLRenderer({ canvas: $('cv'), antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(35, 1, 0.5, 20000);
  camera.up.set(0, 0, 1);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.screenSpacePanning = true;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 0.85));
  const d = new THREE.DirectionalLight(0xffffff, 0.75); d.position.set(1, -2, 3); scene.add(d);
  const d2 = new THREE.DirectionalLight(0xffffff, 0.3); d2.position.set(-2, 1, -1); scene.add(d2);
  new ResizeObserver(resize).observe($('stage'));
  (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
}
function resize() {
  const r = $('stage').getBoundingClientRect(); if (!r.width) return;
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
function view(dir) {
  const v = new THREE.Vector3(...{ iso: [1, -1.3, 0.9], top: [0, -0.001, 1], side: [0, -1, 0], end: [1, 0, 0] }[dir]).normalize();
  // fit the model's box to the screen from this direction
  const fwd = v.clone().negate(), right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize(), up = new THREE.Vector3().crossVectors(right, fwd);
  const b = new THREE.Box3().setFromObject(group); let hw = 0, hh = 0, hd = 0;
  for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) {
    const c = new THREE.Vector3(x, y, z); hw = Math.max(hw, Math.abs(c.dot(right))); hh = Math.max(hh, Math.abs(c.dot(up))); hd = Math.max(hd, Math.abs(c.dot(fwd)));
  }
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), th = tv * camera.aspect;
  const dist = Math.max(hh / tv, hw / th) * 1.18 + hd;
  camera.position.copy(v.multiplyScalar(dist)); controls.target.set(0, 0, 0);
  camera.near = dist / 200; camera.far = dist * 20; camera.updateProjectionMatrix();
}
function color(kind) { return new THREE.Color(css({ main: '--main', part: '--part', bolt: '--bolt', weld: '--weld' }[kind] || '--main')); }

function showModel(job, data, a) {
  $('picker').hidden = true; ['hdr', 'stage', 'ftr'].forEach(i => $(i).hidden = false);
  initGL(); resize();
  $('mark').textContent = a.mark;
  $('job').textContent = `${data.job} · ${data.client_job} · ${data.project}`;
  document.title = `${a.mark} · ${data.job} – ACF 3D`;
  $('marks').innerHTML = '';
  Object.keys(data.assemblies).sort().forEach(m => {
    const el = document.createElement('a'); el.href = '#' + slug(job, m); el.textContent = m;
    if (m === a.mark) el.setAttribute('aria-current', 'true'); $('marks').append(el);
  });
  if (group) scene.remove(group);
  group = new THREE.Group();
  const box = new THREE.Box3();
  a.meshes.forEach(m => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(m.v, 3)); g.setIndex(m.f); g.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ color: color(m.kind), metalness: 0.15, roughness: 0.65, flatShading: true, polygonOffset: true, polygonOffsetFactor: 1 });
    const mesh = new THREE.Mesh(g, mat); group.add(mesh);
    if (m.kind !== 'weld') group.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 30), new THREE.LineBasicMaterial({ color: new THREE.Color(css('--fg')), transparent: true, opacity: 0.35 })));
    g.computeBoundingBox(); box.union(g.boundingBox);
  });
  if (camera.aspect < 0.9 && !a.vertical) group.rotation.y = -Math.PI / 2;  // long horizontal pieces stand up on a portrait phone; columns and ladders keep their real up
  scene.add(group);
  radius = box.getBoundingSphere(new THREE.Sphere()).radius;
  view('iso');
  const [L, W, H] = a.size_in;
  $('size').textContent = `Overall ${ftin(L)} × ${ftin(W)} × ${ftin(H)}`;
  const kinds = new Set(a.meshes.map(m => m.kind));
  const chips = [`<span><i class="sw" style="background:var(--main)"></i>${a.mark} main member</span>`];
  const others = Object.entries(a.parts).filter(([n]) => n !== a.mark);
  if (others.length) chips.push(`<span><i class="sw" style="background:var(--part)"></i>${others.map(([n, q]) => `${n} ×${q}`).join(', ')}</span>`);
  if (a.bolts) chips.push(`<span><i class="sw" style="background:var(--bolt)"></i>bolts ×${a.bolts}</span>`);
  if (kinds.has('weld')) chips.push(`<span><i class="sw" style="background:var(--weld)"></i>welds</span>`);
  $('parts').innerHTML = chips.join('');
  $('note').textContent = `From the SDS2 model issued with Trans ${data.trans} (${data.issued}). For viewing only – the shop drawing governs all dimensions.`;
}

function showPicker(note) {
  ['hdr', 'stage', 'ftr'].forEach(i => $(i).hidden = true); $('picker').hidden = false;
  document.title = 'ACF 3D Assemblies';
  $('joblist').innerHTML = (note ? `<p class="note">${note}</p>` : '') + index.map(j => `
    <section><div class="job">${j.job} · ${j.client_job} · ${j.project} · Trans ${j.trans}</div>
    <nav class="marks">${j.marks.map(m => `<a href="#${slug(j.job, m)}">${m}</a>`).join('')}</nav></section>`).join('');
}

async function route() {
  try {
    index = index || await getJSON('data/index.json');
    const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    const j = index.find(j => h.startsWith(j.job + '-'));
    if (!j) return showPicker(h ? `No assembly found for “${h}”.` : '');
    const data = await getJSON(`data/${j.job}.json`);
    const mark = Object.keys(data.assemblies).find(m => slug(j.job, m) === h);
    if (!mark) return showPicker(`${j.job}: no assembly “${h.slice(j.job.length + 1)}” in this release.`);
    showModel(j.job, data, data.assemblies[mark]);
  } catch (e) {
    showPicker(''); $('joblist').innerHTML = '<p class="note">The models could not load. Reload the page; if it keeps failing, tell the detailing office.</p>';
  }
}
$('b-reset').onclick = () => view('iso'); $('b-top').onclick = () => view('top');
$('b-side').onclick = () => view('side'); $('b-end').onclick = () => view('end');
addEventListener('hashchange', route);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', route);
new MutationObserver(route).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
route();
</script>

</body>
</html>
